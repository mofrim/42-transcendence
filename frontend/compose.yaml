# yaml-language-server: $schema=https://raw.githubusercontent.com/compose-spec/compose-spec/master/schema/compose-spec.json

# set the project name. doing this in all sub-compose-files will make `docker
# compose up --build` recognize the containers as belonging to the same proj
# which will avoid the `name already in use` error.
name: ft_transcendence

services:
    frontend:
        container_name: ftr-frontend
        image: ftr-frontend
        build:
            context: ..
            dockerfile: ./frontend/Dockerfile
            args:
                USER_ID: ${UID:-1000}
                GROUP_ID: ${GID:-1000}
        environment:
            USER_ID: ${UID:-1000}
            GROUP_ID: ${GID:-1000}
        volumes:
            - ./docker-dist:/dist
