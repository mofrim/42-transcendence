<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ft_transcendence</title>
    <link rel="stylesheet" href="src/index.css">
  </head>
  <body>

  <div id="map-preview" class="map-preview" aria-hidden="true">
    <canvas id="map-preview-canvas" aria-hidden="true"></canvas>
  </div>

  <!-- LOGIN -->
  <div id="login-ui">
    <div class="login-title">ft_transcendence</div>
    <div class="login-subtitle">42 Wolfsburg Project</div>

    <input id="email" type="text" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <div class="player-select" role="radiogroup" aria-label="Player character selection">
      <label class="player-option">
        <input type="radio" name="player-character" value="true" checked>
        <span>
          <strong>👨🏻‍💻 Male</strong>
        </span>
      </label>

      <label class="player-option">
        <input type="radio" name="player-character" value="false">
        <span>
          <strong>👩🏻‍💻 Female</strong>
        </span>
      </label>
    </div>

    <div id="character-preview" class="character-preview" role="img" aria-label="Selected player character 3D preview">
      <canvas id="character-preview-canvas" aria-hidden="true"></canvas>
      <div id="character-preview-label">Male_Test.glb</div>
    </div>

    <div class="server-settings" aria-label="Game server settings">
      <div class="server-fields">
        <label class="server-field">
          <span>Server address</span>
          <input id="server-address" class="server-address" type="text" value="localhost" placeholder="localhost or 192.168.1.23" autocomplete="off" spellcheck="false">
        </label>

        <label class="server-field">
          <span>Server port</span>
          <input id="server-port" class="server-port" type="number" value="3000" placeholder="3000" min="1" max="65535" inputmode="numeric">
        </label>
      </div>
      <div class="server-help">Default: http://localhost:3000</div>
    </div>

    <!-- CHECKBOXES -->
    <label class="terms">
      <input type="checkbox" id="privacy-checkbox">
      <span>I agree to the <a href="/privacy-policy.html" target="_blank">Privacy Policy</a></span>
      <input type="checkbox" id="tos-checkbox">
      <span>I agree to the <a href="/terms.html" target="_blank">Terms of Service</a></span>
    </label>

    <button id="start-btn">ENTER</button>
  </div>

  <!-- GAME -->
  <div id="game">
    <div id="container"></div>

    <div id="info">
      <a href="https://threejs.org" target="_blank">three.js</a> - Walking Demo<br/>
      Use arrows to move
    </div>

    <!----
    <div id="chat-ui">
      <div id="chat-frame">
        <input id="chat-input" type="text" placeholder="Type..." />
      </div>
    </div>
    -->
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "../build/three.module.js",
      "three/addons/": "./jsm/"
    }
  }
  </script>

  <!-- MAIN SCRIPT -->
  <script type="module">
    import { startGame } from './src/js/main.js';
    import { createCharacterPreview } from './src/js/character_preview.js';
    import { createMapPreview } from './src/js/map_preview.js';

    const selectedCharacter = () => document.querySelector('input[name="player-character"]:checked')?.value !== "false";
    const serverAddressInput = document.getElementById("server-address");
    const serverPortInput = document.getElementById("server-port");
    const defaultServerAddress = "localhost";
    const defaultServerPort = "3000";
    const supportedServerProtocols = new Set(["http:", "https:", "ws:", "wss:"]);
    const hasProtocol = (address) => /^[a-z][a-z\d+\-.]*:\/\//i.test(address);
    const hasExplicitPort = (address) => {
      const addressWithoutProtocol = address.replace(/^[a-z][a-z\d+\-.]*:\/\//i, "");
      const authority = addressWithoutProtocol.split(/[/?#]/, 1)[0];
      const host = authority.slice(authority.lastIndexOf("@") + 1);

      if (host.startsWith("[")) {
        return /^\[[^\]]+\]:\d+$/.test(host);
      }

      return /:\d+$/.test(host);
    };
    const readServerPort = () => {
      const port = serverPortInput?.value.trim() || defaultServerPort;
      const portNumber = Number(port);

      if (!/^\d+$/.test(port) || !Number.isInteger(portNumber) || portNumber < 1 || portNumber > 65535) {
        alert("Server port must be an integer from 1 to 65535.");
        return null;
      }

      return String(portNumber);
    };
    const composeServerUrl = () => {
      const address = serverAddressInput?.value.trim() || defaultServerAddress;
      const addressWithProtocol = hasProtocol(address) ? address : `http://${address}`;
      let serverUrl;

      try {
        serverUrl = new URL(addressWithProtocol);
      } catch {
        alert("Enter a valid server address.");
        return null;
      }

      if (!supportedServerProtocols.has(serverUrl.protocol)) {
        alert("Server protocol must be http://, https://, ws://, or wss://.");
        return null;
      }

      if (!hasExplicitPort(address)) {
        const port = readServerPort();

        if (!port) {
          return null;
        }

        serverUrl.port = port;
      }

      return serverUrl.origin;
    };
    const mapPreviewContainer = document.getElementById("map-preview");
    const mapPreview = createMapPreview({
      canvas: document.getElementById("map-preview-canvas"),
    });
    const characterPreview = createCharacterPreview({
      canvas: document.getElementById("character-preview-canvas"),
      label: document.getElementById("character-preview-label"),
    });
    let previewsDisposed = false;
    let gameStarting = false;

    const disposePreviews = () => {
      if (previewsDisposed) {
        return;
      }

      previewsDisposed = true;
      characterPreview.dispose();
      mapPreview.dispose();
      mapPreviewContainer?.remove();
    };

    document.querySelectorAll('input[name="player-character"]').forEach((input) => {
      input.addEventListener("change", () => {
        if (input.checked) {
          characterPreview.setCharacter(selectedCharacter());
        }
      });
    });

    characterPreview.setCharacter(selectedCharacter());

    document.getElementById("start-btn").addEventListener("click", (event) => {
      const privacyAccepted = document.getElementById("privacy-checkbox").checked;
      const tosAccepted = document.getElementById("tos-checkbox").checked;

      /* if (!privacyAccepted || !tosAccepted) {
        alert("You must accept both Privacy Policy and Terms of Service.");
        return;
      } */

      const serverUrl = composeServerUrl();

      if (!serverUrl) {
        return;
      }

      const character = selectedCharacter();

      document.getElementById("login-ui").style.display = "none";
      document.getElementById("game").style.display = "block";

      disposePreviews();

      startGame(character, serverUrl);
    });
  </script>
  </body>
</html>
