<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ft_transcendence</title>
    <link rel="stylesheet" href="src/index.css">
  </head>
  <body>

  <!-- LOGIN -->
  <div id="login-ui">
    <div class="login-title">ft_transcendence</div>
    <div class="login-subtitle">42 Wolfsburg Project</div>

    <input id="email" type="text" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <div class="player-select" role="radiogroup" aria-label="Player character selection">
      <label class="player-option">
        <input type="radio" name="player-character" value="true" checked>
        <span>
          <strong>👨🏻‍💻 Male</strong>
        </span>
      </label>

      <label class="player-option">
        <input type="radio" name="player-character" value="false">
        <span>
          <strong>👩🏻‍💻 Female</strong>
        </span>
      </label>
    </div>

    <div id="character-preview" class="character-preview" role="img" aria-label="Selected player character 3D preview">
      <canvas id="character-preview-canvas" aria-hidden="true"></canvas>
      <div id="character-preview-label">Male_Test.glb</div>
    </div>

    <!-- CHECKBOXES -->
    <label class="terms">
      <input type="checkbox" id="privacy-checkbox">
      <span>
        I agree to the
        <a href="/privacy-policy.html" target="_blank">Privacy Policy</a>
      </span>
    </label>

    <label class="terms">
      <input type="checkbox" id="tos-checkbox">
      <span>
        I agree to the
        <a href="/terms.html" target="_blank">Terms of Service</a>
      </span>
    </label>

    <button id="start-btn">ENTER</button>
  </div>

  <!-- GAME -->
  <div id="game">
    <div id="container"></div>

    <div id="info">
      <a href="https://threejs.org" target="_blank">three.js</a> - Walking Demo<br/>
      Use arrows to move
    </div>

    <!----
    <div id="chat-ui">
      <div id="chat-frame">
        <input id="chat-input" type="text" placeholder="Type..." />
      </div>
    </div>
    -->
  </div>

  IMPORT MAP
  <script type="importmap">
  {
    "imports": {
      "three": "../build/three.module.js",
      "three/addons/": "./jsm/"
    }
  }
  </script>

  <!-- MAIN SCRIPT -->
  <script type="module">
    import { startGame } from './src/js/main.js';
    import { createCharacterPreview } from './src/js/character_preview.js';

    const selectedCharacter = () => document.querySelector('input[name="player-character"]:checked')?.value ?? "true";
    const characterPreview = createCharacterPreview({
      canvas: document.getElementById("character-preview-canvas"),
      label: document.getElementById("character-preview-label"),
    });

    document.querySelectorAll('input[name="player-character"]').forEach((input) => {
      input.addEventListener("change", () => {
        if (input.checked) {
          characterPreview.setCharacter(input.value);
        }
      });
    });

    characterPreview.setCharacter(selectedCharacter());

    document.getElementById("start-btn").addEventListener("click", () => {
      const privacyAccepted = document.getElementById("privacy-checkbox").checked;
      const tosAccepted = document.getElementById("tos-checkbox").checked;

      /* if (!privacyAccepted || !tosAccepted) {
        alert("You must accept both Privacy Policy and Terms of Service.");
        return;
      } */

      document.getElementById("login-ui").style.display = "none";
      document.getElementById("game").style.display = "block";

      characterPreview.dispose();

      const character = selectedCharacter() === "true";
      startGame(character);
    });
  </script>
  </body>
</html>
