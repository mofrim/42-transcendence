# prevent container start race condition on DNS resolution
## docker DNS resolver
resolver 127.0.0.11 valid=1s ipv6=off;

upstream conn_service {
    zone conn_service 32k;
    server conn-service:3000 resolve;
}

upstream auth_service {
    zone auth_service 32k;
    server auth-service:3001 resolve;
}

upstream eventlog_service {
    zone eventlog_service 32k;
    server eventlog-service:3002 resolve;
}

upstream user_service {
    zone user_service 32k;
    server user-service:3003 resolve;
}

upstream pgadmin_service {
    zone pgadmin_service 32k;
    server pgadmin:80 resolve;
}

server {
    listen 1111 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/ssl/server-cert.pem;
    ssl_certificate_key /etc/nginx/ssl/server-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';

    # _not_ being strict here. if your client does not support any of our secure
    # ciphers we will fallback to using clients' ciphers.
    ssl_prefer_server_ciphers off;

    # cache ssl handshakes so do not have to be repeated if a client visits the
    # server more often in a short period of time
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /socket.io/ {
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        proxy_pass http://conn_service;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /pgadmin {
        return 301 /pgadmin/;
    }

    location /pgadmin/ {
        proxy_set_header X-Script-Name /pgadmin;
        proxy_set_header X-Scheme $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # fix: Failed to load preferences
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Host $host;

        proxy_pass http://pgadmin_service;
        proxy_redirect off;
    }

    location ~ ^/api/(login|logout|protected|validateSession) {
        proxy_pass http://auth_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/eventlog {
        proxy_pass http://eventlog_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/user {
        proxy_pass http://user_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

}
