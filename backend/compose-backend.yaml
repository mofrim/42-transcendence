# set the project name. doing this in all sub-compose-files will make `docker
# compose up --build` recognize the containers as belonging to the same proj
# which will avoid the `name already in use` error.
name: ft_transcendence

services:

  backend:
    container_name: ftr-backend
    image: ftr-backend
    build:
      context: ..
      dockerfile: Dockerfile.backend
    depends_on:
      postgres:
        condition: service_started
    ports:
      - 3000:3000
    networks:
      - tr-net

  postgres:
    container_name: ftr-postgres
    image: postgres:latest
    ports:
      - 5432:5432
    networks:
      - tr-net
    environment:
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_DB: postgres

  pgadmin:
    container_name: ftr-pgadmin
    image: dpage/pgadmin4:latest
    depends_on:
      postgres:
        condition: service_started
    configs:
      - source: pgadmin_servers.json
        target: /pgadmin4/servers.json
    networks:
      - tr-net
    environment:
      PGADMIN_DEFAULT_EMAIL: dev@ftr.com
      PGADMIN_DEFAULT_PASSWORD: password
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "80:80"

configs:
  pgadmin_servers.json:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "local",
            "Group": "Servers",
            "Port": 5432,
            "Username": "postgres",
            "Host": "postgres",
            "SSLMode": "prefer",
            "MaintenanceDB": "postgres"
          }
        }
      }

networks:
  tr-net:
    driver: bridge

